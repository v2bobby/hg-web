<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="56" viewBox="0 0 240 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: Stylized merit badge / ranking ascent -->
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  
  <!-- Hexagon / shield base for trust -->
  <path d="M28 8 L44 16 L44 36 L28 44 L12 36 L12 16 Z" fill="#111827" stroke="#3B82F6" stroke-width="2.5"/>
  
  <!-- Inner ascending bars for merit/ranking -->
  <rect x="18" y="28" width="5" height="10" rx="1" fill="#3B82F6"/>
  <rect x="25" y="22" width="5" height="16" rx="1" fill="#3B82F6"/>
  <rect x="32" y="16" width="5" height="22" rx="1" fill="#3B82F6"/>
  
  <!-- Wordmark -->
  <text x="58" y="32" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-1.5" fill="#F1F5F9">Hiredey</text>
  <text x="155" y="32" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-1.5" fill="#3B82F6">Go</text>
  
  <!-- Subtle underline accent -->
  <rect x="58" y="38" width="170" height="2.5" rx="1" fill="#3B82F6" opacity="0.25"/>
</svg>